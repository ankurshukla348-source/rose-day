<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Rose Day</title>
<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}
.container {
  text-align: center;
  color: #b3002d;
}
.rose {
  font-size: 90px;
  animation: float 2.5s ease-in-out infinite;
}
@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-25px); }
  100% { transform: translateY(0); }
}
h1 {
  margin: 20px 0 10px;
}
p {
  font-size: 20px;
}
</style>
</head>
<body>
  <div class="container">
    <div class="rose">🌹</div>
    <h1>Happy Rose Day</h1>
    <p>cookie from ur pookie ❤️</p>
  </div>
</body>
  </html>
